    .doc-section + .doc-section {

    .links a:hover { color: var(--brand-gold); }

      .docs-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

        children: [
          {
            id: "foundation-public-sector-economy",
            title: "Public-Sector Economy",
            keywords: ["city", "vote", "credits", "issuance", "redemption", "civic-credit loop", "public economy", "bounded coordination economy"],
            summary:
              "The public-sector economy is the operational heart of City/Sync: verified civic labor produces civic credits, those credits unlock real local access, and redemption data feeds back into policy and coordination decisions.",
            sections: [
              {
                heading: "What the Public-Sector Economy Is",
                paragraphs: [
                  "City/Sync proposes a bounded coordination economy for public life. It does not try to replace private markets, public budgets, or philanthropy. Instead, it creates a structured way to recognize civic contribution that markets routinely fail to price and that public institutions often struggle to organize at scale.",
                  "In this model, Issuer Organizations publish verifiable civic work, Civic-Participants perform that work, and Redeemer Organizations accept civic credits in exchange for goods and services. The result is a repeatable loop where contribution becomes legible, reward becomes useful, and institutions gain a clearer operating pathway for mobilizing local capacity."
                ]
              },
              {
                heading: "How the Civic-Credit Loop Works",
                bullets: [
                  "An Issuer Organization creates or issues a task that serves a public good or public service objective.",
                  "A Civic-Participant claims the task, completes it, and submits evidence or proof for review.",
                  "The Issuer verifies the work and mints CITY and VOTE according to the approved rate and workflow.",
                  "The Civic-Participant can redeem CITY with Redeemer Organizations offering local goods or services.",
                  "When redemption happens, CITY is burned and removed from circulation, creating a visible record of utility and demand."
                ]
              },
              {
                heading: "Why This Loop Matters",
                paragraphs: [
                  "The system only works if contribution is connected to real use. Issuance without redemption produces weak signals and idle balances. Redemption without meaningful contribution turns the system into subsidy without coordination value. City/Sync is built around the idea that the public-sector economy must be useful, measurable, and operationally stable.",
                  "That is why the protocol treats issuance and redemption as two sides of the same mechanism. Verified work expands civic capacity; redemption closes the loop by proving that the reward is functionally meaningful in local life."
                ]
              },
              {
                heading: "Public Economy Models",
                paragraphs: [
                  "City/Sync is not a generic rewards program and not a charity layer. It is a public coordination model designed to organize contribution, institutional participation, and civic legitimacy around measurable outcomes."
                ]
              },
              {
                heading: "How the Model Differs from Familiar Systems",
                paragraphs: [
                  "Traditional volunteer systems rely heavily on goodwill, fragmented administration, and weak feedback loops. Traditional market systems only reward labor when private demand can price it. Traditional public-sector systems often recognize the need for civic contribution but lack a portable operational structure for managing it consistently across organizations.",
                  "City/Sync sits in the gap between those models. It creates a civic-credit economy that is bounded by governance, rate logic, verification standards, and redemption capacity. That bounded structure is what makes the model operational rather than symbolic."
                ]
              },
              {
                heading: "Core Design Assumptions",
                bullets: [
                  "Civic labor has real public value even when markets do not price it well.",
                  "Institutions need standardized operating pathways, not just more enthusiasm or more outreach.",
                  "Credits must remain tied to verifiable work and usable redemption pathways to stay meaningful.",
                  "Governance must tune the model as a real system, not treat it like a one-time app launch.",
                  "Replication requires portable procedures and standards, not just software."
                ]
              },
              {
                heading: "Why the Model Is Bounded",
                paragraphs: [
                  "A public economy cannot be left open-ended if it is expected to retain legitimacy. Rates, issuance, task approval, redemption commitments, and governance checkpoints all exist to ensure that civic credits remain credible. The goal is not infinite issuance or unconstrained participation. The goal is a stable operating environment that can expand responsibly.",
                  "That bounded structure is what allows City/Sync to function as civic infrastructure rather than just another incentive layer."
                ]
              }
            ],
            children: [
              {
                id: "foundation-managing-the-economy",
                title: "Managing the Economy",
                keywords: ["managing the economy", "issuance cap", "redemption capacity", "economic management", "stability", "dormant credits", "carrying capacity", "retention"],
                summary:
                  "Managing the City/Sync economy means preserving the balance between civic-credit issuance, redemption utility, organizational capacity, and governance legitimacy as the system grows. The goal is to keep civic credits worth earning, worth spending, and capable of scaling responsibly.",
                sections: [
                  {
                    heading: "Overview",
                    paragraphs: [
                      "City/Sync is designed to help cities recognize civic labor, reward it with civic credits, and connect those credits to real local goods and services. People complete civic work, earn CITY, and redeem those credits through Redeemer Organizations that provide access to offerings such as transit, cultural institutions, educational access, or other public-serving benefits.",
                      "Managing the economy means making sure that this loop stays healthy. If credits are issued much faster than they are redeemed, balances begin to pile up and the reward loses meaning. If redemption demand grows faster than redeemer capacity, the system becomes frustrating and unstable. If there are too few meaningful opportunities to earn, participation weakens. The economy therefore has to be governed as a living system rather than treated like a one-time feature launch."
                    ]
                  },
                  {
                    heading: "Credits Flow Like Water",
                    paragraphs: [
                      "A useful way to think about the City/Sync economy is as a bathtub. The faucet represents issuance. Every time an Issuer Organization verifies civic labor and rewards a participant, new credits flow into the system. The drain represents redemption. Every time a participant redeems CITY for an offering, those credits are burned and permanently removed from circulation.",
                      "The water level in the tub represents the outstanding stock of unspent credits sitting in participant wallets. If issuance runs faster than redemption, the tub fills up and unspent balances accumulate. If redemption runs faster than issuance, the tub empties and credits become too scarce. A healthy public-sector economy seeks to keep the water level stable enough that credits remain meaningful, usable, and trusted."
                    ]
                  },
                  {
                    heading: "The Issuance Cap and the Epoch",
                    paragraphs: [
                      "The main tool used to control the faucet is the issuance cap. This is the maximum amount of CITY that can be issued during a defined operating period. In the pilot, that period is an Epoch, which lasts three months. At the end of each Epoch, the system can be reviewed and recalibrated based on actual behavior.",
                      "The issuance cap is important because it gives governance a hard boundary. Instead of letting issuance grow without discipline, the cap ensures that the amount of CITY entering the system stays connected to what the redemption side can realistically absorb."
                    ],
                    bullets: [
                      "Issuance caps limit how much CITY can be distributed within a given Epoch.",
                      "Epoch reviews create a regular cadence for evaluating whether the economy should expand, tighten, or hold steady.",
                      "Governance can use cap adjustments to respond to real conditions rather than assumptions."
                    ]
                  },
                  {
                    heading: "Active Credits, Dormant Credits, and Expiry",
                    paragraphs: [
                      "Not everyone who enters the system will remain active forever. Some people move away, get busy, or stop participating. When that happens, their credits may remain in their wallet without being redeemed. Those balances are dormant credits: they still exist on paper, but they are no longer meaningfully circulating through the economy.",
                      "To keep the model accurate, City/Sync distinguishes between active credits and dormant credits. Active credits are held by people who have earned or spent within the last 12 months. Dormant credits are held by people who have not done either. If someone remains inactive for 12 consecutive months, their credits expire and are removed from the system. If they return before then and earn or redeem even once, their activity clock resets and their balance remains active."
                    ],
                    bullets: [
                      "Active credits help governance understand real economic pressure inside the system.",
                      "Dormant credits represent balances that are no longer meaningfully circulating.",
                      "Expiry after 12 months of inactivity prevents abandoned balances from distorting the economic picture.",
                      "This makes it possible to manage the economy based on real participation rather than stale balances."
                    ]
                  },
                  {
                    heading: "Carrying Capacity and the Safe Zone",
                    paragraphs: [
                      "There is a practical limit to how many credits the economy can create without causing problems. That limit is determined by redemption capacity: how many credits Redeemer Organizations can actually absorb through their available offerings. If the system can realistically absorb 600 credits per month, issuing 800 credits per month will cause balances to accumulate faster than they can be burned.",
                      "Because some credits will eventually expire and because demand is never perfectly smooth, City/Sync should not operate at the exact edge of that limit. A safer operating range is below full carrying capacity, leaving enough room for uneven demand, operational surprises, and the need to protect Redeemer Organizations from becoming overburdened."
                    ],
                    bullets: [
                      "Carrying capacity is shaped by the total redemption volume the redeemer side can actually support.",
                      "Issuance should remain below that ceiling rather than testing the system at its edge.",
                      "Protecting redeemer capacity is essential because overwhelmed redeemers may withdraw offerings, which shrinks the redemption side of the economy."
                    ]
                  },
                  {
                    heading: "The Main Economic Dashboard",
                    paragraphs: [
                      "City/Sync tracks a small set of core indicators to understand whether the economy is healthy. These indicators function like the gauges on a dashboard. They do not replace judgment, but they make it possible to govern based on legible signals instead of guesswork."
                    ],
                    bullets: [
                      "Earn-spend loop: Are issued credits actually being redeemed at healthy rates?",
                      "Service capacity: Are redeemer offerings comfortably absorbing demand or nearing their limits?",
                      "Active backlog: How many months of unspent credits are active participants holding?",
                      "Retention: Are people staying engaged, or are large portions of the credit base drifting into dormancy?"
                    ]
                  },
                  {
                    heading: "1. The Earn-Spend Loop",
                    paragraphs: [
                      "The first question is whether credits are actually being used. If participants earn CITY and then redeem it for meaningful offerings, the system is doing its job. If large portions of issued credits never get redeemed, something is wrong. The offerings may not be attractive enough, the prices may be too high, the redemption process may be too difficult, or participants may be leaving before they use what they have earned.",
                      "A healthy earn-spend loop shows that the economy is delivering value on both sides: meaningful recognition for civic labor and meaningful access to real local benefits."
                    ]
                  },
                  {
                    heading: "2. Service Capacity",
                    paragraphs: [
                      "The second question is whether the redemption side can absorb demand. If bus passes, museum tickets, classes, or other offerings are constantly near their limit, the system is approaching a constraint. That does not necessarily mean the economy is failing, but it does mean governance should expand redeemer capacity before allowing much more issuance.",
                      "This indicator is especially important because some offerings will always be more attractive than others. Economic management therefore has to watch not just overall redemption, but where redemption pressure is concentrating."
                    ]
                  },
                  {
                    heading: "3. Active Backlog",
                    paragraphs: [
                      "The third question is how many unspent credits active participants are holding. Some backlog is normal. People may be saving for a larger redemption or waiting for an offering they value. But if active participants are holding many months' worth of unspent CITY, the system is signaling a mismatch between issuance and practical utility.",
                      "This measure focuses only on active participants because dormant balances do not create real short-term pressure. The point is to understand whether engaged users feel like the credits they hold can realistically be used."
                    ]
                  },
                  {
                    heading: "4. Retention",
                    paragraphs: [
                      "The fourth question is whether participants stay involved. Retention is not just a community engagement metric; it also affects the economics of the system. When people leave, their balances eventually expire, which changes how much issuance headroom the economy has. Strong retention means the economy is delivering enough value for people to remain active. Weak retention suggests a problem with the overall experience.",
                      "This is why retention matters to both policy and product. If people are dropping out, governance needs to ask whether the issue is task quality, onboarding friction, weak offerings, poor communication, or something else in the participant journey."
                    ]
                  },
                  {
                    heading: "How Decisions Get Made",
                    paragraphs: [
                      "The purpose of these indicators is to guide action. When credits are circulating well, services have room, active backlogs are modest, and retention is strong, the system has room to grow. Existing Issuer Organizations may be allowed to issue more, and eventually new issuers can be onboarded.",
                      "When services are getting crowded, governance should focus on expanding the redeemer side before expanding issuance. When credits are piling up but services still have room, the problem is likely on the redemption experience side, which may require better offerings, better pricing, or a simpler redemption process. When people are leaving, the problem may be task quality, onboarding, or participant experience. And when the economy is clearly out of balance, governance may need to contract the issuance cap sharply until conditions stabilize."
                    ]
                  },
                  {
                    heading: "The Golden Rule of Growth",
                    paragraphs: [
                      "The most important growth principle in the City/Sync economy is simple: expand the spending side before expanding the earning side. In practice, this means increasing redeemer capacity before significantly increasing issuance capacity.",
                      "If the system grows the issuance side too quickly without first deepening redemption options, the result is predictable: credits accumulate faster than participants can use them. Growth is healthiest when new capacity to burn credits is in place before new capacity to mint them."
                    ]
                  },
                  {
                    heading: "Why the First Year Requires Extra Discipline",
                    paragraphs: [
                      "The 12-month expiry rule means the first year of the pilot behaves differently from the long-run system. During that first year, no dormant credits have reached expiry yet. Credits are being issued and redeemed, but the cleanup mechanism has not started removing abandoned balances. That makes Year 1 especially sensitive to over-issuance.",
                      "For that reason, the system should begin conservatively. It is safer to issue below theoretical capacity early, observe real behavior, and scale from evidence than to overfill the system and spend months correcting a backlog."
                    ]
                  },
                  {
                    heading: "Why This Matters",
                    paragraphs: [
                      "Every control, metric, and governance rule in the City/Sync economy exists to protect one core outcome: the sense that civic credits are worth something. If people earn CITY and cannot use it, the reward becomes symbolic. If redeemers are overwhelmed, the system becomes costly and unstable. If opportunities to earn become too constrained, the value of participation starts to feel arbitrary or inaccessible.",
                      "Managing the economy is one of the protocol's core responsibilities. It is also what makes City/Sync portable. Other cities will not adopt the model simply because the software exists. They will only adopt it if the economy proves it can stay legible and useful under real operating conditions."
                    ]
                  }
                ]
              },
              {
                id: "foundation-issuance-cap",
                title: "The Issuance Cap",
                keywords: ["issuance cap", "epoch", "city issuance", "cap", "economic control", "credit supply", "allocation", "redeemer capacity", "issuer budget"],
                summary:
                  "The Issuance Cap is the governance-set ceiling on how much CITY can enter circulation during an Epoch. It is the protocol's primary supply control, keeping civic-credit issuance tied to redemption capacity, system health, and disciplined growth.",
                sections: [
                  {
                    heading: "Overview",
                    paragraphs: [
                      "In any economy, the supply of currency matters. Too much money chasing too few goods produces inflation. Too little circulating produces stagnation. A civic-credit economy faces the same structural challenge even if it is not a monetary economy in the traditional sense.",
                      "The Issuance Cap is City/Sync's answer to that problem. It is the governance-set ceiling on how many credits can enter the system in a given period. It is the single most important economic control tool in the protocol because its calibration determines whether the civic-credit economy feels alive and is economically sustainable."

                    heading: "How the Cap Is Determined",
                    paragraphs: [
                      "The Issuance Cap is not an arbitrary number. It follows a simple principle: the system cannot sustainably issue more credits than it can absorb. Absorption happens through redemption. The total amount of credits that Redeemer Organizations can realistically absorb defines the system's redemption capacity.",
                      "That capacity is shaped by real-world constraints: how many transit rides, class seats, museum tickets, or other offerings exist, and how much of that capacity redeemers are willing to commit to the civic-credit program. Governance then applies a safety margin so the system does not operate at the edge of failure."

                    bullets: [

                      "A system operating around 70-75% of estimated capacity is far safer than one operating at 100%."

    const state = {
      query: "",
      selectedId: "",
      expanded: new Set(DOCS_TREE.map(node => node.id)),
    };

    const index = new Map();

    function walk(nodes, path = []) {
      nodes.forEach(node => {
        const nextPath = [...path, node];
        index.set(node.id, { node, path: nextPath });
        if (node.children?.length) {
          walk(node.children, nextPath);
        }
      });
    }

    walk(DOCS_TREE);

    function firstDocumentId(nodes = DOCS_TREE) {
      for (const node of nodes) {
        if (Array.isArray(node.sections)) return node.id;
        if (node.children?.length) {
          const nested = firstDocumentId(node.children);
          if (nested) return nested;
        }
      }
      return "";
    }

    function includesText(value, query) {
      return String(value || "").toLowerCase().includes(query);
    }

    function collectSearchText(node) {
      const sectionText = (node.sections || [])
        .flatMap(section => [section.heading, ...(section.paragraphs || []), ...(section.bullets || [])])
        .join(" ");
      const keyText = (node.keywords || []).join(" ");
      return `${node.title || ""} ${node.summary || ""} ${sectionText} ${keyText}`.toLowerCase();
    }

    function matchesSubtree(node, query) {
      if (!query) return true;
      if (includesText(collectSearchText(node), query)) return true;
      return (node.children || []).some(child => matchesSubtree(child, query));
    }

    function toggleNode(id) {
      if (state.expanded.has(id)) {
        state.expanded.delete(id);
      } else {
        state.expanded.add(id);
      }
      renderTree();
    }

    function selectDocument(id, updateHash = true) {
      const entry = index.get(id);
      if (!entry) return;
      if (!Array.isArray(entry.node.sections)) return;

      state.selectedId = id;
      renderTree();
      renderContent();

      if (updateHash) {
        history.replaceState(null, "", `#${id}`);
      }
    }

    function renderTree() {
      const tree = document.getElementById("doc-tree");
      tree.innerHTML = "";

      const query = state.query.trim().toLowerCase();

      function renderNode(node, depth) {
        if (!matchesSubtree(node, query)) return null;

        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        const isDoc = Array.isArray(node.sections);
        const isExpanded = query ? true : state.expanded.has(node.id);

        const wrap = document.createElement("div");
        wrap.className = "tree-node";

        const row = document.createElement("div");
        row.className = "tree-row";
        row.style.paddingLeft = `${depth * 12}px`;

        if (hasChildren) {
          const toggle = document.createElement("button");
          toggle.className = `tree-toggle${isExpanded ? " is-open" : ""}`;
          toggle.type = "button";
          toggle.setAttribute("aria-label", isExpanded ? `Collapse ${node.title}` : `Expand ${node.title}`);
          toggle.addEventListener("click", event => {
            event.stopPropagation();
            toggleNode(node.id);
          });
          row.appendChild(toggle);
        } else {
          const spacer = document.createElement("span");
          spacer.style.width = "22px";
          spacer.style.height = "22px";
          spacer.style.display = "inline-block";
          row.appendChild(spacer);
        }

        const label = document.createElement("button");
        label.type = "button";
        label.className = `tree-label${hasChildren ? " group" : ""}${state.selectedId === node.id ? " selected" : ""}`;
        label.textContent = node.title;

        if (isDoc) {
          label.addEventListener("click", () => selectDocument(node.id));
        } else if (hasChildren) {
          label.addEventListener("click", () => toggleNode(node.id));
        } else {
          label.disabled = true;
        }

        row.appendChild(label);
        wrap.appendChild(row);

        if (hasChildren && isExpanded) {
          const childrenWrap = document.createElement("div");
          childrenWrap.className = "tree-children";

          node.children.forEach(child => {
            const childNode = renderNode(child, depth + 1);
            if (childNode) childrenWrap.appendChild(childNode);
          });

          if (childrenWrap.childElementCount > 0) {
            wrap.appendChild(childrenWrap);
          }
        }

        return wrap;
      }

      DOCS_TREE.forEach(node => {
        const element = renderNode(node, 0);
        if (element) tree.appendChild(element);
      });

      if (!tree.childElementCount) {
        const none = document.createElement("div");
        none.className = "no-results";
        none.textContent = "No matching documentation topics found.";
        tree.appendChild(none);
      }
    }

    function renderContent() {
      const entry = index.get(state.selectedId);
      if (!entry) return;

      const { node, path } = entry;
      const docPath = document.getElementById("doc-path");
      const docTitle = document.getElementById("doc-title");
      const docSummary = document.getElementById("doc-summary");
      const docContent = document.getElementById("doc-content");

      const pathTitles = path.map(step => step.title);
      docPath.textContent = `Documentation / ${pathTitles.join(" / ")}`;
      docTitle.textContent = node.title;
      docSummary.textContent = node.summary || "";

      docContent.innerHTML = "";

      (node.sections || []).forEach(section => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "doc-section";

        const heading = document.createElement("h3");
        heading.textContent = section.heading;
        sectionEl.appendChild(heading);

        (section.paragraphs || []).forEach(text => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          sectionEl.appendChild(paragraph);
        });

        if (Array.isArray(section.bullets) && section.bullets.length > 0) {
          const list = document.createElement("ul");
          list.className = "doc-list";

          section.bullets.forEach(item => {
            const listItem = document.createElement("li");
            const text = document.createElement("span");
            text.textContent = item;
            listItem.appendChild(text);
            list.appendChild(listItem);
          });

          sectionEl.appendChild(list);
        }

        docContent.appendChild(sectionEl);
      });
    }

    function initSelection() {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      const hashEntry = index.get(hashId);
      if (hashEntry && Array.isArray(hashEntry.node.sections)) {
        state.selectedId = hashId;
      } else {
        state.selectedId = firstDocumentId();
      }
    }

    function bindEvents() {
      const search = document.getElementById("doc-search");
      search.addEventListener("input", event => {
        state.query = event.target.value || "";
        renderTree();
      });
    }

    initSelection();
    bindEvents();
    renderTree();
    renderContent();

    window.addEventListener("hashchange", () => {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      if (!hashId) return;
      const entry = index.get(hashId);
      if (entry && Array.isArray(entry.node.sections)) {
        state.selectedId = hashId;
        renderTree();
        renderContent();
      }
    });
  </script>
</body>
</html>
