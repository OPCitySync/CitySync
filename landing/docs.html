  <style>

    a { color: inherit; text-decoration: none; }

      width: min(1240px, 94vw);

    }

    .nav {

      top: 0;
      z-index: 100;
      background: var(--brand-blue);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    .nav-row {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1rem;
    }

    .brand-nav {
      gap: 0;
      font-size: 0;
      font-weight: 400;
    }

    .brand-wordmark {
      height: 34px;
      width: auto;
      display: block;
    }

    .header-label {
      color: var(--brand-gold);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .docs-main {
      padding: clamp(22px, 3vw, 34px) 0 clamp(66px, 8vw, 94px);
    }

    .docs-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: clamp(18px, 2vw, 26px);
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 96px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(33, 50, 56, 0.12);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 14px;
      max-height: calc(100vh - 130px);
      overflow: auto;
    }

    .search-wrap {
      position: sticky;
      top: -14px;
      z-index: 2;
      margin: -14px -14px 10px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.9));
      border-bottom: 1px solid rgba(33, 50, 56, 0.08);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid rgba(33, 50, 56, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.94rem;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--brand-gold);
      box-shadow: 0 0 0 3px rgba(221, 158, 51, 0.14);
    }

    .tree-node + .tree-node {
      margin-top: 3px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border-radius: 9px;
    }

    .tree-row:hover {
      background: rgba(244, 239, 228, 0.72);
    }

    .tree-toggle {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      border-radius: 6px;
      cursor: pointer;
      flex: 0 0 auto;
      position: relative;
    }

    .tree-toggle::before {
      content: "▸";
      display: block;
      line-height: 1;
      font-size: 0.8rem;
      transform: translateY(1px);
      transition: transform 0.15s ease;
    }

    .tree-toggle.is-open::before {
      transform: rotate(90deg) translateY(0);
      transform-origin: center;
    }

    .tree-label {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 0.9rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }

    .tree-label.group {
      font-weight: 700;
      color: #2d4047;
    }

    .tree-label.selected {
      background: rgba(221, 158, 51, 0.14);
      color: #7a4f10;
      box-shadow: inset 0 0 0 1px rgba(221, 158, 51, 0.35);
    }

    .tree-children {
      margin-top: 2px;
    }

    .no-results {
      color: var(--ink-soft);
      font-size: 0.9rem;
      padding: 10px;
    }

    .content-col {
      min-width: 0;
    }

    .title-card,
    .content-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(33, 50, 56, 0.12);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: clamp(18px, 2.8vw, 30px);

    .content-card {
      margin-top: 14px;
    }

    .doc-path {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 700;
      margin-bottom: 10px;

    .doc-title {
      margin: 0;
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .doc-summary {
      margin: 12px 0 0;
      color: var(--ink-soft);
      max-width: 80ch;
      font-size: 1.02rem;
    }

    .doc-section + .doc-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px dashed rgba(33, 50, 56, 0.18);
    }

    .doc-section h3 {
      margin: 0 0 9px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }

    .doc-section p {
      margin: 0;
      color: var(--ink-soft);
    }

    .doc-section p + p {
      margin-top: 10px;
    }

    .doc-list {
      margin: 10px 0 0;
      padding-left: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .doc-list li {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 10px;
      align-items: start;
      color: var(--ink-soft);
    }

    .doc-list li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 6px;
      background: linear-gradient(120deg, var(--brand-gold), #f3d596);
      box-shadow: 0 0 0 3px rgba(221, 158, 51, 0.12);
    }

    .doc-actions {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed rgba(33, 50, 56, 0.18);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .doc-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(33, 50, 56, 0.14);
      background: rgba(255, 255, 255, 0.95);
      color: var(--brand-blue);
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .doc-action-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(221, 158, 51, 0.45);
      color: var(--brand-gold);
    }

    .footer {
      padding: 38px 0 44px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      background: var(--brand-blue);
    }

    .footer-row {
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .links a:hover { color: var(--brand-gold); }

    @media (max-width: 1000px) {
      .docs-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }
    }
  </style>

  <script>
    const DOCS_TREE = [
      {
        id: "foundation",
        title: "City/Sync Foundation",
        children: [
        ]
      },
      {
        id: "pilot",
        title: "City/Sync Pilot Program",
        children: [
          {
            id: "pilot-overview",
            title: "Pilot Program Overview",
            keywords: ["pilot", "overview", "deployment model", "programmable public coordination", "berkeley", "mexico city"],
            summary:
              "The City/Sync Pilot Program is a deployment model for programmable public coordination. Its purpose is to demonstrate how institutional authority, structured civic participation, and governed redemption pathways can operate inside a unified administrative environment while remaining legible, governable, and replicable across cities.",
            sections: [
              {
                heading: "Overview",
                paragraphs: [
                  "The City/Sync Pilot Program establishes a deployment model through which cities can onboard into programmable public coordination infrastructure. It is designed to show how institutional authority and structured civic participation can operate within a unified administrative environment while remaining governable and replicable.",
                  "The pilot is meant to produce operational precedent. It introduces the procedural, economic, social, and governance conditions required for cities to coordinate participation as a functional component of public service ecosystems rather than as an informal or peripheral activity.",
                  "This page outlines the design logic, deployment structure, governance model, and evaluation criteria that guide the pilot. Its purpose is not only to describe a concept, but to define a working model that other jurisdictions can assess and implement."
                ]
              },
              {
                heading: "The Purpose of the Pilot",
                paragraphs: [
                  "The pilot is designed to confirm that programmable public coordination can function under real administrative conditions. It seeks to show that a new coordination layer can be adopted inside existing institutional environments without requiring structural disruption to public governance.",
                  "The proposed framework is structured to operate across two distinct governance contexts: Berkeley, California and Mexico City, Mexico. The goal is to validate that a shared coordination model can function across varied institutional conditions while maintaining operational coherence."
                ]
              },
              {
                heading: "The Four Objectives of Deployment",
                bullets: [
                  "Establish a repeatable municipal onboarding process.",
                  "Validate participation issuance and service redemption mechanisms and processes.",
                  "Validate the concept of Mass Coordination Events as a method for bootstrapping local administration.",
                  "Expand the issuer and redeemer ecosystem through real-world operational use."
                ]
              },
              {
                heading: "Procedural Implementation",
                paragraphs: [
                  "The framework is intentionally procedural. It is structured so participating jurisdictions can demonstrate not only that the model can function, but that it can be reproduced. In that sense, the pilot operates as guidance infrastructure that establishes the conditions under which a new coordination layer becomes administratively viable.",
                  "The pilot is therefore not simply an experiment in app usage. It is a deployment sequence for showing how programmable coordination can enter real administrative routines through recognizable institutional pathways."
                ]
              },
              {
                heading: "Roles Within the Pilot",
                bullets: [
                  "Issuers: organizations that issue tasks expanding their non-private goods and services mission. Eligible issuers are incorporated public-service organizations with local service history and the capacity to manage a volunteer program, and they must adhere to governance mandates from representative issuer organizations.",
                  "Redeemers: organizations that offer access to goods and services. Eligible redeemers are incorporated public or private organizations willing to redeem access with civic credits, and they must adhere to governance mandates from representative redeemer organizations.",
                  "Civic Participants: individuals who claim and execute civic-labor opportunities provided by issuers. Eligible participants are any citizens or non-citizens capable of performing local tasks, and they must commit to governance mandates from representative issuer and redeemer organizations.",
                  "Validators: individuals or organizations capable of verifying the work performed by civic participants. Validators must commit to the governance mandates of their reporting issuer organization."
                ]
              },
              {
                heading: "Deployment Models as Instruments of Administrative Change",
                paragraphs: [
                  "Institutional change becomes durable only when new operating patterns are introduced under real conditions, observed, and refined through practice. For that reason, deployment models are critical instruments of administrative evolution. Historically, shifts such as participatory budgeting, digital service delivery, and integrated data systems scaled because early jurisdictions demonstrated they could function inside the constraints of law, budgeting, oversight, and public accountability.",
                  "Programmable coordination presents a similar challenge. The technical capacity now exists, but public institutions still need operational pathways that translate capability into practiced governance. Without a deployment model, programmable coordination remains conceptual. The City/Sync Pilot Framework is intended to provide that pathway."
                ]
              },
              {
                heading: "What the Pilot Is Designed to Validate",
                paragraphs: [
                  "The first objective is to establish a repeatable municipal onboarding process. Participating jurisdictions need to be able to integrate coordination infrastructure without requiring structural reorganization or exceptional governance accommodations. Adoption should feel like an extension of institutional capability rather than a departure from it.",
                  "The second objective is to validate the mechanics of participation issuance and service redemption in real service environments. Civic participation only becomes operationally meaningful when contributions can be recognized, accounted for, and exchanged through pathways that remain politically legible and administratively manageable.",
                  "The third objective is to validate Mass Coordination Events. These are time-bound events that center issuer tasks around a collective communal goal such as clearing a local government backlog, coordinating a cleanup, or reporting public safety hazards. They demonstrate what becomes possible when a city converges around a shared mission while also bootstrapping participants, issuers, and redeemers into the coordination network.",
                  "The fourth objective is to expand the issuer and redeemer ecosystem through active deployment. A coordination layer becomes more durable when institutions beyond the original participants see clear reasons to join. Early operational value is meant to attract additional issuers and redeemers, increasing the density and usefulness of the network."
                ]
              },
              {
                heading: "Cross-Governance Deployment",
                paragraphs: [
                  "The City/Sync Pilot is implemented concurrently across Berkeley and Mexico City because an administratively viable coordination layer should demonstrate adaptability across distinct governance environments rather than functioning only under one set of political or regulatory conditions.",
                  "Berkeley represents a civic environment known for policy experimentation, public-sector innovation, and strong civic engagement. Mexico City represents a very different landscape defined by scale, complexity, dense populations, and highly distributed service needs. The objective is not to compare cities against one another. It is to show that a shared framework can integrate with different administrative structures while remaining coherent.",
                  "This dual-context deployment also reduces perceived adoption risk for other jurisdictions. When a model functions across varied settings, it becomes harder to dismiss as locally idiosyncratic and easier for other cities to imagine integrating within their own governance frameworks."
                ]
              },
              {
                heading: "The Dual-Market Coordination Engine",
                paragraphs: [
                  "The pilot functions through the interaction of two interdependent participation markets: the issuer ecosystem and the participant community. Issuers introduce structured participation opportunities aligned with measurable service objectives. Participants supply the civic capacity that activates those pathways. Redemption entities complete the loop by providing service pathways through which participation is recognized and exchanged.",
                  "The stability of the coordination layer depends on the balanced growth of both sides rather than on the rapid growth of one side alone. If participation outpaces institutional capacity, the system destabilizes. If organizations issue opportunities without sufficient engagement, the system remains thin and underused. The pilot is designed to develop coordination momentum by allowing issuer growth, participant activation, and redemption expansion to reinforce one another over time.",
                  "When that happens, the coordination layer begins to behave like infrastructure rather than a standalone program. Organizations start planning around participation pathways, and residents begin anticipating their availability as part of public life."
                ]
              },
              {
                heading: "Issuer Onboarding as Infrastructure",
                paragraphs: [
                  "The durability of the City/Sync coordination layer depends on the systematic onboarding of issuers. Issuers are not auxiliary actors in the pilot. They are the institutional interfaces through which civic participation becomes operational. For that reason, issuer onboarding is treated as infrastructure rather than outreach.",
                  "Each issuer enters the system with three core capabilities: the ability to structure participation opportunities, the authority to verify contribution, and the capacity to align participation outcomes with organizational metrics. This design is intentional. The pilot is not asking issuers to adopt an entirely new program model. It is enabling them to extend existing programs through coordinated civic capacity.",
                  "In practice, onboarding follows a standardized sequence: organizations define participation opportunities aligned with operational objectives, establish verification mechanisms, configure issuance parameters, and then observe engagement patterns once live. Over time, this creates issuer clustering, shared participant bases, and cross-issuer coordination opportunities."
                ]
              },
              {
                heading: "Redemption Architecture",
                paragraphs: [
                  "Redemption is the mechanism that makes civic participation materially legible within public and nonprofit service ecosystems. For programmable coordination to function as an administrative layer, participation must translate into access pathways that institutions can support without introducing fiscal ambiguity or governance risk.",
                  "The pilot therefore treats redemption as structured service access rather than as financial exchange. Participation credits operate inside clearly bounded redemption environments where contribution and access remain operationally transparent. This aligns naturally with public-sector practices such as eligibility structures, subsidized services, and community benefit programs.",
                  "Wherever possible, redemption pathways prioritize underutilized inventory, marginal service capacity, or programs designed to expand community reach. This allows participation to unlock real value without placing unsustainable strain on institutional resources, and it keeps redemption politically understandable to policymakers and the public."
                ]
              },
              {
                heading: "Designing for Replication",
                paragraphs: [
                  "The long-term significance of the pilot lies not only in operational performance but in whether it can be reproduced across jurisdictions. Administrative innovations matter systemically only when they establish patterns that other institutions can confidently adopt without exceptional conditions.",
                  "For that reason, the pilot is designed with replication as a primary constraint. It integrates with existing governance structures, operates within familiar budgetary logic, and avoids dependency on uniquely favorable political or organizational circumstances. The framework documents both outcomes and process: onboarding protocols, issuer agreements, verification models, redemption structures, and governance procedures all become part of the implementation blueprint.",
                  "Replication also depends on survivability. Cities are more likely to adopt models that remain stable under normal operating conditions rather than ones dependent on extraordinary leadership or temporary funding. By embedding the pilot inside existing workflows while retaining modular flexibility at the edges, City/Sync aims to create a stable core that other cities can adapt locally."
                ]
              },
              {
                heading: "Governance of the Pilot",
                paragraphs: [
                  "The introduction of a new coordination layer into public administration requires governance structures that are visible and credible. Institutional adoption depends not only on operational feasibility but on the assurance that oversight mechanisms can guide the system responsibly as it evolves.",
                  "The pilot is governed through a framework centered on parameter control, administrative transparency, and defined oversight roles. Participating jurisdictions retain policy authority throughout the pilot. Decisions around issuer eligibility, redemption expansion, participation focus areas, and operational adjustments remain within institutional discretion so that programmable coordination functions as an extension of public governance rather than an external influence upon it.",
                  "The framework also emphasizes bounded adaptability. Adjustments occur through deliberate review rather than reactive improvisation. Documentation of governance decisions, onboarding processes, and operational changes ensures procedural memory persists beyond individual administrators."
                ]
              },
              {
                heading: "What Success Looks Like",
                paragraphs: [
                  "The success of the pilot is evaluated through observable administrative outcomes that signal the coordination layer is functioning as intended in real institutional environments. One marker is municipal operability: onboarding, issuer integration, redemption pathways, and governance oversight should all function inside existing administrative workflows.",
                  "A second marker is issuer persistence. Organizations that continue participating, expand their opportunities, refine verification practices, and deepen their integration provide evidence that the coordination layer delivers real operational value. Ecosystem expansion is another important signal. When additional nonprofits, agencies, and service providers seek integration because they see clear incentives to join, the layer begins to exhibit gravitational pull.",
                  "Participation stability, redemption continuity, and governance confidence are equally important. The system succeeds when contribution patterns become predictable, service providers remain comfortable maintaining redemption pathways, and administrators begin to see the coordination layer as observable, controllable, and institutionally useful."
                ]
              },
              {
                heading: "The Direction of Public Coordination",
                paragraphs: [
                  "Administrative systems rarely transform through singular events. Change becomes visible when new operating patterns begin to function inside routine governance. The City/Sync Pilot is structured to contribute to that kind of transition by introducing programmable coordination through governed deployment rather than advocacy alone.",
                  "If the framework succeeds, its impact will extend beyond the participating jurisdictions. It will have helped define a procedural pathway through which a new coordination layer can enter public administration. At that point, other cities no longer ask whether such a model is possible. They begin asking when and how it might be appropriate within their own administrative context."
                ]
              }
            ]
          },
          {
            id: "foundation-public-sector-economy",
            title: "Public-Sector Economy",
            keywords: ["city", "vote", "credits", "issuance", "redemption", "civic-credit loop", "public economy", "bounded coordination economy"],
            summary:
              "The public-sector economy is the operational heart of City/Sync: verified civic labor produces civic credits, those credits unlock real local access, and redemption data feeds back into policy and coordination decisions.",
            sections: [
              {
                heading: "What the Public-Sector Economy Is",
                paragraphs: [
                  "City/Sync proposes a bounded coordination economy for public life. It does not try to replace private markets, public budgets, or philanthropy. Instead, it creates a structured way to recognize civic contribution that markets routinely fail to price and that public institutions often struggle to organize at scale.",
                  "In this model, Issuer Organizations publish verifiable civic work, Civic-Participants perform that work, and Redeemer Organizations accept civic credits in exchange for goods and services. The result is a repeatable loop where contribution becomes legible, reward becomes useful, and institutions gain a clearer operating pathway for mobilizing local capacity."
                ]
              },
              {
                heading: "How the Civic-Credit Loop Works",
                bullets: [
                  "An Issuer Organization creates or issues a task that serves a public good or public service objective.",
                  "A Civic-Participant claims the task, completes it, and submits evidence or proof for review.",
                  "The Issuer verifies the work and mints CITY and VOTE according to the approved rate and workflow.",
                  "The Civic-Participant can redeem CITY with Redeemer Organizations offering local goods or services.",
                  "When redemption happens, CITY is burned and removed from circulation, creating a visible record of utility and demand."
                ]
              },
              {
                heading: "Why This Loop Matters",
                paragraphs: [
                  "The system only works if contribution is connected to real use. Issuance without redemption produces weak signals and idle balances. Redemption without meaningful contribution turns the system into subsidy without coordination value. City/Sync is built around the idea that the public-sector economy must be useful, measurable, and operationally stable.",
                  "That is why the protocol treats issuance and redemption as two sides of the same mechanism. Verified work expands civic capacity; redemption closes the loop by proving that the reward is functionally meaningful in local life."
                ]
              },
              {
                heading: "Public Economy Models",
                paragraphs: [
                  "City/Sync is not a generic rewards program and not a charity layer. It is a public coordination model designed to organize contribution, institutional participation, and civic legitimacy around measurable outcomes."
                ]
              },
              {
                heading: "How the Model Differs from Familiar Systems",
                paragraphs: [
                  "Traditional volunteer systems rely heavily on goodwill, fragmented administration, and weak feedback loops. Traditional market systems only reward labor when private demand can price it. Traditional public-sector systems often recognize the need for civic contribution but lack a portable operational structure for managing it consistently across organizations.",
                  "City/Sync sits in the gap between those models. It creates a civic-credit economy that is bounded by governance, rate logic, verification standards, and redemption capacity. That bounded structure is what makes the model operational rather than symbolic."
                ]
              },
              {
                heading: "Core Design Assumptions",
                bullets: [
                  "Civic labor has real public value even when markets do not price it well.",
                  "Institutions need standardized operating pathways, not just more enthusiasm or more outreach.",
                  "Credits must remain tied to verifiable work and usable redemption pathways to stay meaningful.",
                  "Governance must tune the model as a real system, not treat it like a one-time app launch.",
                  "Replication requires portable procedures and standards, not just software."
                ]
              },
              {
                heading: "Why the Model Is Bounded",
                paragraphs: [
                  "A public economy cannot be left open-ended if it is expected to retain legitimacy. Rates, issuance, task approval, redemption commitments, and governance checkpoints all exist to ensure that civic credits remain credible. The goal is not infinite issuance or unconstrained participation. The goal is a stable operating environment that can expand responsibly.",
                  "That bounded structure is what allows City/Sync to function as civic infrastructure rather than just another incentive layer."

    const state = {
      query: "",
      selectedId: "",
      expanded: new Set(DOCS_TREE.map(node => node.id)),
    };

    const index = new Map();

    function walk(nodes, path = []) {
      nodes.forEach(node => {
        const nextPath = [...path, node];
        index.set(node.id, { node, path: nextPath });
        if (node.children?.length) {
          walk(node.children, nextPath);
        }
      });
    }

    walk(DOCS_TREE);

    function firstDocumentId(nodes = DOCS_TREE) {
      for (const node of nodes) {
        if (Array.isArray(node.sections)) return node.id;
        if (node.children?.length) {
          const nested = firstDocumentId(node.children);
          if (nested) return nested;
        }
      }
      return "";
    }

    function includesText(value, query) {
      return String(value || "").toLowerCase().includes(query);
    }

    function collectSearchText(node) {
      const sectionText = (node.sections || [])
        .flatMap(section => [section.heading, ...(section.paragraphs || []), ...(section.bullets || [])])
        .join(" ");
      const keyText = (node.keywords || []).join(" ");
      return `${node.title || ""} ${node.summary || ""} ${sectionText} ${keyText}`.toLowerCase();
    }

    function matchesSubtree(node, query) {
      if (!query) return true;
      if (includesText(collectSearchText(node), query)) return true;
      return (node.children || []).some(child => matchesSubtree(child, query));
    }

    function toggleNode(id) {
      if (state.expanded.has(id)) {
        state.expanded.delete(id);
      } else {
        state.expanded.add(id);
      }
      renderTree();
    }

    function selectDocument(id, updateHash = true) {
      const entry = index.get(id);
      if (!entry) return;
      if (!Array.isArray(entry.node.sections)) return;

      state.selectedId = id;
      renderTree();
      renderContent();

      if (updateHash) {
        history.replaceState(null, "", `#${id}`);
      }
    }

    function renderTree() {
      const tree = document.getElementById("doc-tree");
      tree.innerHTML = "";

      const query = state.query.trim().toLowerCase();

      function renderNode(node, depth) {
        if (!matchesSubtree(node, query)) return null;

        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        const isDoc = Array.isArray(node.sections);
        const isExpanded = query ? true : state.expanded.has(node.id);

        const wrap = document.createElement("div");
        wrap.className = "tree-node";

        const row = document.createElement("div");
        row.className = "tree-row";
        row.style.paddingLeft = `${depth * 12}px`;

        if (hasChildren) {
          const toggle = document.createElement("button");
          toggle.className = `tree-toggle${isExpanded ? " is-open" : ""}`;
          toggle.type = "button";
          toggle.setAttribute("aria-label", isExpanded ? `Collapse ${node.title}` : `Expand ${node.title}`);
          toggle.addEventListener("click", event => {
            event.stopPropagation();
            toggleNode(node.id);
          });
          row.appendChild(toggle);
        } else {
          const spacer = document.createElement("span");
          spacer.style.width = "22px";
          spacer.style.height = "22px";
          spacer.style.display = "inline-block";
          row.appendChild(spacer);
        }

        const label = document.createElement("button");
        label.type = "button";
        label.className = `tree-label${hasChildren ? " group" : ""}${state.selectedId === node.id ? " selected" : ""}`;
        label.textContent = node.title;

        if (isDoc) {
          label.addEventListener("click", () => selectDocument(node.id));
        } else if (hasChildren) {
          label.addEventListener("click", () => toggleNode(node.id));
        } else {
          label.disabled = true;
        }

        row.appendChild(label);
        wrap.appendChild(row);

        if (hasChildren && isExpanded) {
          const childrenWrap = document.createElement("div");
          childrenWrap.className = "tree-children";

          node.children.forEach(child => {
            const childNode = renderNode(child, depth + 1);
            if (childNode) childrenWrap.appendChild(childNode);
          });

          if (childrenWrap.childElementCount > 0) {
            wrap.appendChild(childrenWrap);
          }
        }

        return wrap;
      }

      DOCS_TREE.forEach(node => {
        const element = renderNode(node, 0);
        if (element) tree.appendChild(element);
      });

      if (!tree.childElementCount) {
        const none = document.createElement("div");
        none.className = "no-results";
        none.textContent = "No matching documentation topics found.";
        tree.appendChild(none);
      }
    }

    function renderContent() {
      const entry = index.get(state.selectedId);
      if (!entry) return;

      const { node, path } = entry;
      const docPath = document.getElementById("doc-path");
      const docTitle = document.getElementById("doc-title");
      const docSummary = document.getElementById("doc-summary");
      const docContent = document.getElementById("doc-content");

      const pathTitles = path.map(step => step.title);
      docPath.textContent = `Documentation / ${pathTitles.join(" / ")}`;
      docTitle.textContent = node.title;
      docSummary.textContent = node.summary || "";

      docContent.innerHTML = "";

      (node.sections || []).forEach(section => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "doc-section";

        const heading = document.createElement("h3");
        heading.textContent = section.heading;
        sectionEl.appendChild(heading);

        (section.paragraphs || []).forEach(text => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          sectionEl.appendChild(paragraph);
        });

        if (Array.isArray(section.bullets) && section.bullets.length > 0) {
          const list = document.createElement("ul");
          list.className = "doc-list";

          section.bullets.forEach(item => {
            const listItem = document.createElement("li");
            const text = document.createElement("span");
            text.textContent = item;
            listItem.appendChild(text);
            list.appendChild(listItem);
          });

          sectionEl.appendChild(list);
        }

        docContent.appendChild(sectionEl);
      });

      if (Array.isArray(node.pageLinks) && node.pageLinks.length > 0) {
        const actions = document.createElement("div");
        actions.className = "doc-actions";

        node.pageLinks.forEach(link => {
          const action = document.createElement("a");
          action.className = "doc-action-btn";
          action.href = link.href;
          action.target = "_blank";
          action.rel = "noopener noreferrer";
          action.textContent = link.label;
          actions.appendChild(action);
        });

        docContent.appendChild(actions);
      }
    }

    function initSelection() {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      const hashEntry = index.get(hashId);
      if (hashEntry && Array.isArray(hashEntry.node.sections)) {
        state.selectedId = hashId;
      } else {
        state.selectedId = firstDocumentId();
      }
    }

    function bindEvents() {
      const search = document.getElementById("doc-search");
      search.addEventListener("input", event => {
        state.query = event.target.value || "";
        renderTree();
      });
    }

    initSelection();
    bindEvents();
    renderTree();
    renderContent();

    window.addEventListener("hashchange", () => {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      if (!hashId) return;
      const entry = index.get(hashId);
      if (entry && Array.isArray(entry.node.sections)) {
        state.selectedId = hashId;
        renderTree();
        renderContent();
      }
    });
  </script>
